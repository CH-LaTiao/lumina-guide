<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">LUMINA Guide — Perceive. Understand. Assist.</title>
  <desc id="desc">A wearable RGB-D assistance research prototype. A schematic vest links depth perception, scene understanding and concise cues. Public demo.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091321"/><stop offset="1" stop-color="#133747"/></linearGradient>
    <linearGradient id="vest" x2="1" y2="1"><stop stop-color="#21495a"/><stop offset="1" stop-color="#0e2535"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#80c9d0" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1280" height="440" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="24" fill="url(#grid)"/>
  <path d="M760 0V440" stroke="#71d3cf" stroke-opacity=".15"/>
