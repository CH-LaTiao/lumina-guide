name: static-checks

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python compile
        run: python -m compileall -q tools tests
      - name: JS syntax
        run: node --check tools/live_view.js
      - name: Hardware-free tests
        run: python -m unittest tests.test_live_view_js tests.test_ground_line -v
